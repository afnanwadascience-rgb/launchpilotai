async function api(path, options={}){ const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})};let response;try{response=await fetch(path,{credentials:'same-origin',...options,headers});}catch{throw new Error('Could not connect to the server. Check the deployment and try again.');}let payload={};const text=await response.text();try{payload=text?JSON.parse(text):{};}catch{payload={error:text||'Unexpected server response.'};}if(!response.ok){const err=new Error(payload.error||`Request failed (${response.status}).`);err.status=response.status;err.code=payload.code;throw err;}return payload;}

const DASH_NAV=[{label:'Overview',path:'/dashboard',icon:'grid',group:'WORKSPACE'},{label:'Idea Validator',path:'/dashboard/tool/idea-validator',icon:'target',group:'CREATE'},{label:'Product Blueprint',path:'/dashboard/tool/product-blueprint',icon:'layers',group:'CREATE'},{label:'Sales Page Generator',path:'/dashboard/tool/sales-page-generator',icon:'file',group:'CREATE'},{label:'Pricing Assistant',path:'/dashboard/tool/pricing-assistant',icon:'coins',group:'CREATE'},{label:'Marketing Kit',path:'/dashboard/tool/marketing-kit',icon:'megaphone',group:'CREATE'},{label:'Launch Calendar',path:'/dashboard/calendar',icon:'calendar',group:'ORGANIZE'},{label:'Competitor Tracker',path:'/dashboard/competitors',icon:'users',group:'ORGANIZE'},{label:'Saved Projects',path:'/dashboard/projects',icon:'folder',group:'ORGANIZE'},{label:'Usage & Billing',path:'/dashboard/billing',icon:'credit',group:'ACCOUNT'},{label:'Settings',path:'/dashboard/settings',icon:'settings',group:'ACCOUNT'}];
function activeNav(path){const r=route();if(path==='/dashboard')return r==='/dashboard';return r===path||r.startsWith(path+'/');}
function sidebar(){const groups=['WORKSPACE','CREATE','ORGANIZE','ACCOUNT'];return `<aside class="sidebar"><div class="sidebar-brand">${logo()}</div>${groups.map(group=>`<div class="workspace-caption">${group}</div>${DASH_NAV.filter(x=>x.group===group).map(x=>`<a class="side-link ${activeNav(x.path)?'active':''}" href="#${x.path}">${icon(x.icon,17)}<span>${x.label}</span>${TOOLS[x.path.split('/').pop()]?.pro?'<span class="badge pro" style="margin-left:auto">PRO</span>':''}</a>`).join('')}`).join('')}<div class="sidebar-bottom"><div class="side-plan"><strong>${state.usage?.plan==='PRO'?'Pro plan':'Free plan'} <span class="badge ${state.usage?.plan==='PRO'?'pro':''}" style="float:right">${state.usage?.plan==='PRO'?'ACTIVE':'FREE'}</span></strong><p>${state.usage?`${state.usage.remaining} of ${state.usage.limit} generations remaining`:'Usage loads when connected.'}</p>${state.usage?.plan==='PRO'?'':`<a class="btn btn-primary btn-sm" style="width:100%" ${checkoutLinkAttrs()}>Upgrade to Pro ${icon('arrow',12)}</a>`}</div><a class="side-link" href="#/" data-action="home">${icon('external',17)}<span>Public website</span></a><button class="side-link" data-action="logout" style="border:0;background:transparent;width:100%;text-align:left">${icon('logout',17)}<span>Sign out</span></button></div></aside>`;}
function dashboardShell(content){const user=state.user||{};const r=route();const title=DASH_NAV.find(x=>activeNav(x.path))?.label||'Overview';return `<div class="dashboard-layout">${sidebar()}<main class="dash-main"><header class="dash-topbar"><div class="topbar-title">${title}</div><div class="topbar-actions">${themeButton()}<span class="avatar" aria-label="Account">${esc((user.name||user.email||'U').trim().slice(0,1).toUpperCase())}</span><div class="hide-mobile" style="font-size:12px"><strong style="display:block">${esc(user.name||'Account')}</strong><span class="muted">${esc(user.email||'')}</span></div></div></header><div class="dash-content">${content}</div><nav class="mobile-dock" aria-label="Mobile workspace navigation">${[{label:'Home',path:'/dashboard',icon:'grid'},{label:'Ideas',path:'/dashboard/tool/idea-validator',icon:'target'},{label:'Calendar',path:'/dashboard/calendar',icon:'calendar'},{label:'Projects',path:'/dashboard/projects',icon:'folder'},{label:'Billing',path:'/dashboard/billing',icon:'credit'}].map(x=>`<a class="${activeNav(x.path)?'active':''}" href="#${x.path}">${icon(x.icon,18)}<span>${x.label}</span></a>`).join('')}</nav></main></div>`;}
function pageTitle(title,desc,actions=''){return `<div class="dash-title-row"><div><h1>${title}</h1><p>${desc}</p></div><div class="dash-actions">${actions}</div></div>`;}
function statusBadge(status){const s=String(status||'todo');const c=s==='done'||s==='ACTIVE'?'good':s==='in-progress'||s==='TRIALING'?'warn':'';return `<span class="badge ${c}">${esc(s.replaceAll('-',' '))}</span>`;}
function overviewPage(){const projects=state.projects||[],tasks=state.tasks||[],outputs=state.outputs||[],open=tasks.filter(t=>t.status!=='done');return `${pageTitle(`Welcome, ${esc((state.user?.name||'there').split(' ')[0])}.`,'A clear place to plan and prepare your next launch.',`<a class="btn btn-primary" href="#/dashboard/tool/idea-validator">${icon('plus',15)} Validate an idea</a><a class="btn btn-secondary" href="#/dashboard/projects">View projects</a>`)}<div class="stats-grid"><div class="stat-card"><div class="stat-label">CURRENT PLAN</div><div class="stat-value" style="font-size:23px">${state.usage?.plan==='PRO'?'Pro':'Free'}</div><div class="stat-foot">${esc(state.usage?.status||'Status unavailable')}</div></div><div class="stat-card"><div class="stat-label">GENERATIONS LEFT</div><div class="stat-value">${state.usage?state.usage.remaining:'—'}</div><div class="stat-foot">${state.usage?`${state.usage.used} used of ${state.usage.limit}`:'Usage loads when connected'}</div></div><div class="stat-card"><div class="stat-label">SAVED PROJECTS</div><div class="stat-value">${projects.length}</div><div class="stat-foot">${state.usage?.plan==='PRO'?'Up to 100':'Up to 3 on Free'}</div></div><div class="stat-card"><div class="stat-label">OPEN LAUNCH TASKS</div><div class="stat-value">${open.length}</div><div class="stat-foot">Across your launch plan</div></div></div>${state.dataError?`<div class="notice">${esc(state.dataError)}</div>`:''}<div class="dash-grid"><section class="panel"><div class="panel-head"><div><h3>Recent projects</h3><p>Open a project to continue working.</p></div><a class="text-link small" href="#/dashboard/projects">All projects ${icon('arrow',12)}</a></div>${projects.length?`<div class="item-list">${projects.slice(0,5).map(p=>`<div class="list-item"><div class="feature-icon" style="width:35px;height:35px;margin:0">${icon('folder',17)}</div><div class="list-item-main"><div class="list-item-title">${esc(p.title)}</div><div class="list-item-meta">Updated ${formatDate(p.updatedAt)} · ${p._count?.generatedContent||0} saved outputs</div></div><a class="btn btn-secondary btn-sm" href="#/dashboard/projects">Open</a></div>`).join('')}</div>`:`<div class="empty-state"><div class="feature-icon">${icon('folder',22)}</div><h3>No projects yet</h3><p>Create a project to organize AI drafts and launch work. Your account data will appear here after it's saved.</p><button class="btn btn-primary btn-sm" data-action="create-project">${icon('plus',13)} Create a project</button></div>`}</section><section class="panel"><div class="panel-head"><div><h3>Next launch tasks</h3><p>Keep the next action visible.</p></div><a class="text-link small" href="#/dashboard/calendar">Calendar</a></div>${open.length?`<div class="item-list">${open.slice(0,5).map(t=>`<div class="list-item"><button class="icon-btn" data-action="toggle-task" data-id="${esc(t.id)}" aria-label="Mark complete">${icon('check',15)}</button><div class="list-item-main"><div class="list-item-title">${esc(t.title)}</div><div class="list-item-meta">Due ${formatDate(t.dueDate)} · ${esc(t.priority||'medium')} priority</div></div></div>`).join('')}</div>`:`<div class="empty-state"><div class="feature-icon">${icon('calendar',21)}</div><h3>No open tasks</h3><p>Add a milestone or checklist item for your next launch.</p><a class="btn btn-secondary btn-sm" href="#/dashboard/calendar">Open launch calendar</a></div>`}</section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Recent generated content</h3><p>Outputs created by your workspace.</p></div><a class="text-link small" href="#/dashboard/projects">Browse saved content</a></div>${outputs.length?`<div class="item-list">${outputs.slice(0,4).map(o=>`<button class="list-item" style="text-align:left;background:transparent;color:inherit" data-action="open-output" data-id="${esc(o.id)}"><div class="feature-icon" style="width:34px;height:34px;margin:0">${icon('file',16)}</div><div class="list-item-main"><div class="list-item-title">${esc(o.title)}</div><div class="list-item-meta">${esc(o.type)} · ${formatDate(o.createdAt)}</div></div>${icon('arrow',15)}</button>`).join('')}</div>`:`<div class="empty-state"><p>Generated outputs appear here after you use an AI tool.</p><a class="btn btn-primary btn-sm" href="#/dashboard/tool/idea-validator">Start with Idea Validator</a></div>`}</section>`;}
function toolsPage(){return `${pageTitle('AI workspaces','Choose a focused tool for your next launch task.')}<div class="tool-grid">${Object.entries(TOOLS).map(([key,t])=>`<article class="tool-card ${t.pro&&state.usage?.plan!=='PRO'?'locked':''}"><div class="feature-icon">${icon(t.icon,22)}</div><h3>${esc(t.title)} ${t.pro&&state.usage?.plan!=='PRO'?'<span class="badge pro">PRO</span>':''}</h3><p>${esc(t.description)}</p><a class="btn ${t.pro&&state.usage?.plan!=='PRO'?'btn-secondary':'btn-primary'} btn-sm" href="#/dashboard/tool/${key}">${t.pro&&state.usage?.plan!=='PRO'?'View tool & upgrade':'Open tool'} ${icon(t.pro&&state.usage?.plan!=='PRO'?'lock':'arrow',13)}</a></article>`).join('')}</div>`;}
function toolFields(tool){return tool.fields.map(([name,label,type,detail])=>{const id=`tool-${name}`;let input='';if(type==='textarea')input=`<textarea id="${id}" name="${name}" ${['idea','audience','problem','product','benefits','value'].includes(name)?'required':''} maxlength="${['idea','product'].includes(name)?1600:2000}" placeholder="${esc(detail)}"></textarea>`;else if(type==='select'){const values=name==='category'?['Ebook / guide','Template','Online course','Software / SaaS','Downloadable resource','Service','Other']:name==='format'&&tool===TOOLS['marketing-kit']?['social','email','announcement','hooks','calendar']:detail;input=`<select id="${id}" name="${name}" required>${values.map((v,i)=>`<option value="${esc(v)}" ${i===0?'selected':''}>${esc(name==='format'&&tool===TOOLS['marketing-kit']?({social:'Social media posts',email:'Email campaign',announcement:'Launch announcement',hooks:'Promotional hooks',calendar:'Content calendar'}[v]||v):v)}</option>`).join('')}</select>`;}else input=`<input id="${id}" name="${name}" type="text" maxlength="1200" ${['audience','tone','productType'].includes(name)?'required':''} placeholder="${esc(detail)}">`;return `<div class="field"><label for="${id}">${esc(label)}</label>${input}</div>`;}).join('');}
function toolPage(toolKey){const t=TOOLS[toolKey];if(!t)return `${pageTitle('AI workspaces','Choose a tool from the list.')}<a class="btn btn-primary" href="#/dashboard/tool/idea-validator">Open Idea Validator</a>`;const locked=t.pro&&state.usage?.plan!=='PRO';const saved=state.toolResult;return `${pageTitle(t.title,t.description,`<a class="btn btn-secondary" href="#/dashboard">${icon('arrow',14)} Dashboard</a>`)}${locked?`<div class="notice"><strong>Pro feature.</strong> Upgrade to Pro to use ${esc(t.title)}. Access will be granted only after the server verifies your membership. <a class="text-link" ${checkoutLinkAttrs()}>Open Whop checkout ${icon('external',12)}</a></div>`:''}<div class="tool-form-layout"><section class="panel"><div class="panel-head"><div><h3>Describe your product</h3><p>Specific inputs help produce more useful drafts.</p></div></div><form id="ai-form" data-tool="${toolKey}" class="tool-form">${toolFields(t)}<div class="field"><label for="tool-projectId">Save under project (optional)</label><select id="tool-projectId" name="projectId"><option value="">No project selected</option>${state.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('')}</select></div><p id="ai-error" class="form-error"></p><button class="btn btn-primary" type="submit" style="width:100%" ${locked?'disabled':''}>${icon('spark',15)} Generate ${esc(t.title)}</button><p class="small muted" style="margin:12px 0 0">Each successful request uses one generation. Results are saved to your account automatically.</p></form></section><section class="panel"><div class="panel-head"><div><h3>Your output</h3><p>Edit the generated draft before exporting or using it.</p></div><span class="badge">Editable</span></div><div id="tool-output-area">${saved?.tool===toolKey?outputEditor(saved):`<div class="empty-state"><div class="feature-icon">${icon('file',22)}</div><h3>Ready when you are</h3><p>Complete the form and generate a first draft. It will appear here for editing and export.</p></div>`}</div></section></div>`;}
function outputEditor(o){return `<div class="field"><label for="result-title">Output title</label><input id="result-title" maxlength="180" value="${esc(o.title||'Generated draft')}"></div><label class="output-title" for="result-editor">Draft content</label><textarea class="tool-result" id="result-editor" data-output-id="${esc(o.contentId||o.id||'')}" maxlength="80000">${esc(o.result??o.body??'')}</textarea><div class="output-actions"><button class="btn btn-primary btn-sm" data-action="save-output" data-id="${esc(o.contentId||o.id||'')}">${icon('check',13)} Save edits</button><button class="btn btn-secondary btn-sm" data-action="copy-output">${icon('copy',13)} Copy text</button><button class="btn btn-secondary btn-sm" data-action="export-output">${icon('download',13)} Export .md</button></div><p class="small muted" style="margin-top:12px">This is a working draft. Verify facts and claims before publishing.</p>`;}
function projectsPage(){const projects=state.projects||[],outputs=state.outputs||[];return `${pageTitle('Saved Projects','Organize your project briefs and reopen generated content.',`<button class="btn btn-primary" data-action="create-project">${icon('plus',15)} New project</button>`)}<div class="panel"><div class="panel-head"><div><h3>Your projects</h3><p>Only your authenticated account can access these records.</p></div><span class="badge">${projects.length} projects</span></div>${projects.length?`<div class="item-list">${projects.map(p=>`<div class="list-item"><div class="feature-icon" style="margin:0;width:36px;height:36px">${icon('folder',17)}</div><div class="list-item-main"><div class="list-item-title">${esc(p.title)}</div><div class="list-item-meta">${esc(p.description||'No description')} · Updated ${formatDate(p.updatedAt)} · ${p._count?.generatedContent||0} outputs · ${p._count?.tasks||0} tasks</div></div><div class="inline-actions"><button class="btn btn-secondary btn-sm" data-action="rename-project" data-id="${esc(p.id)}">Rename</button><button class="btn btn-danger btn-sm" data-action="delete-project" data-id="${esc(p.id)}">${icon('trash',12)}</button></div></div>`).join('')}</div>`:`<div class="empty-state"><div class="feature-icon">${icon('folder',22)}</div><h3>No projects saved</h3><p>Create your first project. It will be stored securely in the connected database.</p><button class="btn btn-primary btn-sm" data-action="create-project">${icon('plus',13)} Create project</button></div>`}</div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Generated outputs</h3><p>Generated drafts are saved automatically and can be edited.</p></div><span class="badge">${outputs.length} outputs loaded</span></div>${outputs.length?`<div class="item-list">${outputs.map(o=>`<div class="list-item"><div class="feature-icon" style="margin:0;width:36px;height:36px">${icon('file',17)}</div><div class="list-item-main"><div class="list-item-title">${esc(o.title)}</div><div class="list-item-meta">${esc(o.type)} · ${formatDate(o.createdAt)}${o.projectId?' · Linked to a project':''}</div></div><div class="inline-actions"><button class="btn btn-secondary btn-sm" data-action="edit-output" data-id="${esc(o.id)}">Edit</button><button class="btn btn-danger btn-sm" data-action="delete-output" data-id="${esc(o.id)}">${icon('trash',12)}</button></div></div>`).join('')}</div>`:`<div class="empty-state"><p>No generated drafts yet. Use an AI tool to create and save one.</p></div>`}</section>`;}
function calendarPage(){const tasks=state.tasks||[];const selected=state.activeFilter;const visible=tasks.filter(t=>selected==='all'||t.status===selected);return `${pageTitle('Launch Calendar','Turn launch milestones into trackable tasks.',`<button class="btn btn-primary" data-action="new-task">${icon('plus',15)} Add task</button>`)}<div class="panel"><div class="panel-head"><div><h3>Your task plan</h3><p>Update priority and status as the work progresses.</p></div><select id="task-filter" class="input" style="width:auto;min-width:145px"><option value="all" ${selected==='all'?'selected':''}>All tasks</option><option value="todo" ${selected==='todo'?'selected':''}>To do</option><option value="in-progress" ${selected==='in-progress'?'selected':''}>In progress</option><option value="done" ${selected==='done'?'selected':''}>Completed</option></select></div>${visible.length?`<div class="table-list">${visible.map(t=>`<div class="task"><input class="task-check" type="checkbox" data-action="task-check" data-id="${esc(t.id)}" ${t.status==='done'?'checked':''} aria-label="Mark ${esc(t.title)} complete"><div class="task-body"><div class="task-title ${t.status==='done'?'done':''}">${esc(t.title)}</div>${t.description?`<div class="task-description">${esc(t.description)}</div>`:''}<div class="task-meta">${statusBadge(t.status)}<span class="badge ${t.priority==='high'?'warn':''}">${esc(t.priority||'medium')} priority</span><span class="badge">Due ${formatDate(t.dueDate)}</span>${t.project?.title?`<span class="badge">${esc(t.project.title)}</span>`:''}</div></div><div class="inline-actions"><button class="icon-btn" data-action="edit-task" data-id="${esc(t.id)}" aria-label="Edit task">${icon('edit',14)}</button><button class="icon-btn" data-action="delete-task" data-id="${esc(t.id)}" aria-label="Delete task">${icon('trash',14)}</button></div></div>`).join('')}</div>`:`<div class="empty-state"><div class="feature-icon">${icon('calendar',22)}</div><h3>${tasks.length?'No tasks match this filter':'No launch tasks yet'}</h3><p>Add the concrete next steps you need to move your product toward launch.</p><button class="btn btn-primary btn-sm" data-action="new-task">${icon('plus',13)} Add task</button></div>`}</div>`;}
function taskDialog(existing){const t=existing||{};return `<div class="form-wrap" style="max-width:680px;margin:0"><form id="task-form" class="form-card" data-id="${esc(t.id||'')}"><h2 style="font-size:24px">${t.id?'Edit task':'New launch task'}</h2><div class="field"><label for="task-title">Title</label><input id="task-title" name="title" required maxlength="180" value="${esc(t.title||'')}"></div><div class="field"><label for="task-description">Description</label><textarea id="task-description" name="description" maxlength="2000">${esc(t.description||'')}</textarea></div><div class="form-row"><div class="field"><label for="task-due">Due date</label><input id="task-due" name="dueDate" type="date" value="${t.dueDate?esc(new Date(t.dueDate).toISOString().slice(0,10)):''}"></div><div class="field"><label for="task-priority">Priority</label><select id="task-priority" name="priority">${['low','medium','high'].map(v=>`<option ${t.priority===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="form-row"><div class="field"><label for="task-status">Status</label><select id="task-status" name="status">${['todo','in-progress','done'].map(v=>`<option value="${v}" ${t.status===v?'selected':''}>${v.replace('-',' ')}</option>`).join('')}</select></div><div class="field"><label for="task-project">Project (optional)</label><select id="task-project" name="projectId"><option value="">No linked project</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${t.projectId===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div></div><div style="display:flex;gap:9px"><button class="btn btn-primary" type="submit">${t.id?'Save changes':'Create task'}</button><button class="btn btn-secondary" type="button" data-action="cancel-dialog">Cancel</button></div></form></div>`;}
function competitorsPage(){const competitors=state.competitors||[];return `${pageTitle('Competitor Tracker','A manual research workspace. This tool does not fetch live competitor data.',`<button class="btn btn-primary" data-action="new-competitor">${icon('plus',15)} Add competitor</button>`)}<div class="notice">Record what you observe from your own research. LaunchPilot AI does not verify competitor prices or automatically crawl these websites.</div><div class="panel"><div class="panel-head"><div><h3>Research notes</h3><p>${competitors.length} records saved to your account</p></div></div>${competitors.length?`<div class="item-list">${competitors.map(c=>`<div class="list-item"><div class="feature-icon" style="margin:0;width:37px;height:37px">${icon('users',17)}</div><div class="list-item-main"><div class="list-item-title">${esc(c.name)}</div><div class="list-item-meta">${c.url?`<a class="text-link" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.url)} ${icon('external',10)}</a> · `:''}Researched ${formatDate(c.researchedAt)}</div><div class="task-description">${esc(c.observations||'No observations entered.')}${c.pricingNotes?`\nPricing notes: ${esc(c.pricingNotes)}`:''}</div></div><div class="inline-actions"><button class="icon-btn" data-action="edit-competitor" data-id="${esc(c.id)}" aria-label="Edit competitor">${icon('edit',14)}</button><button class="icon-btn" data-action="delete-competitor" data-id="${esc(c.id)}" aria-label="Delete competitor">${icon('trash',14)}</button></div></div>`).join('')}</div>`:`<div class="empty-state"><div class="feature-icon">${icon('users',22)}</div><h3>No research notes yet</h3><p>Add competitors and document the information you personally observe.</p><button class="btn btn-primary btn-sm" data-action="new-competitor">${icon('plus',13)} Add competitor</button></div>`}</div>`;}
function competitorDialog(c){const d=c||{};return `<div class="form-wrap" style="max-width:660px;margin:0"><form id="competitor-form" class="form-card" data-id="${esc(d.id||'')}"><h2 style="font-size:24px">${d.id?'Edit research note':'Add competitor'}</h2><div class="field"><label for="competitor-name">Competitor name</label><input id="competitor-name" name="name" required maxlength="180" value="${esc(d.name||'')}"></div><div class="field"><label for="competitor-url">Website URL (optional)</label><input id="competitor-url" name="url" type="url" maxlength="2048" placeholder="https://example.com" value="${esc(d.url||'')}"></div><div class="field"><label for="competitor-observations">Observations</label><textarea id="competitor-observations" name="observations" maxlength="4000">${esc(d.observations||'')}</textarea></div><div class="field"><label for="competitor-pricing">Pricing notes (only what you researched)</label><textarea id="competitor-pricing" name="pricingNotes" maxlength="2000">${esc(d.pricingNotes||'')}</textarea></div><div class="form-row"><div class="field"><label for="competitor-date">Research date</label><input id="competitor-date" name="researchedAt" type="date" value="${d.researchedAt?esc(new Date(d.researchedAt).toISOString().slice(0,10)):new Date().toISOString().slice(0,10)}"></div><div class="field"><label for="competitor-project">Project (optional)</label><select id="competitor-project" name="projectId"><option value="">No linked project</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${d.projectId===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div></div><div style="display:flex;gap:9px"><button class="btn btn-primary" type="submit">Save research</button><button class="btn btn-secondary" type="button" data-action="cancel-dialog">Cancel</button></div></form></div>`;}
function billingPage(){const u=state.usage;return `${pageTitle('Usage & Billing','Check your allowance and verify a Whop membership.',`<a class="btn btn-primary" ${checkoutLinkAttrs()}>Upgrade via Whop ${icon('external',14)}</a>`)}<div class="settings-grid"><section class="panel"><span class="plan-label">CURRENT PLAN</span><div class="price" style="font-size:32px">${u?.plan==='PRO'?'Pro':'Free'}</div><p>${u?.plan==='PRO'?'Your paid plan is currently recognized by the server.':'Use the free planning tools, then upgrade for advanced content generation.'}</p><div class="stat-card" style="margin:18px 0"><div class="stat-label">REMAINING GENERATIONS</div><div class="stat-value">${u?u.remaining:'—'} <span style="font-size:14px;color:var(--muted);font-weight:500">/ ${u?u.limit:'—'}</span></div><div class="progress" style="margin-top:10px"><span style="width:${u&&u.limit?Math.max(0,Math.min(100,100*u.remaining/u.limit)):0}%"></span></div></div><p class="small muted">${u?.plan==='PRO'&&u.resetsAt?`Current billing period end: ${formatDate(u.resetsAt)}`:'Free generations are a lifetime allowance; they do not reset when a browser session changes.'}</p></section><section class="panel"><h3>Refresh membership</h3><p style="font-size:13px">Enter a membership ID from Whop. The server verifies the membership and matches its email, product, and plan before granting access.</p><form id="billing-form"><div class="field"><label for="membership-id">Whop membership ID</label><input id="membership-id" name="membershipId" placeholder="mem_..." required minlength="8" maxlength="160"></div><p id="billing-error" class="form-error"></p><button type="submit" class="btn btn-secondary">${icon('check',14)} Verify membership</button></form><div class="notice">A checkout redirect does not prove payment. Pro access changes only after server verification or a verified Whop webhook.</div></section></div><section class="panel" style="margin-top:16px"><h3>Plan details</h3><div class="item-list"><div class="list-item"><div class="list-item-main"><div class="list-item-title">Free</div><div class="list-item-meta">3 successful AI generations total · up to 3 saved projects · Idea Validator and Product Blueprint</div></div><span class="badge">Current option</span></div><div class="list-item"><div class="list-item-main"><div class="list-item-title">Pro</div><div class="list-item-meta">100 AI generations per billing month · up to 100 saved projects · advanced sales, pricing, and marketing tools</div></div><a class="btn btn-primary btn-sm" ${checkoutLinkAttrs()}>Subscribe</a></div></div><p class="small muted" style="margin-top:14px">Verify the provided checkout URL is valid, reusable, and connected to the intended LaunchPilot Pro product before selling.</p></section>`;}
function settingsPage(){return `${pageTitle('Settings','Manage your profile and interface preferences.')}<div class="settings-grid"><section class="panel"><h3>Profile</h3><p style="font-size:13px">Update the name shown in your workspace.</p><form id="settings-form"><div class="field"><label for="settings-name">Display name</label><input id="settings-name" name="name" maxlength="80" required value="${esc(state.user?.name||'')}"></div><div class="field"><label for="settings-email">Email address</label><input id="settings-email" value="${esc(state.user?.email||'')}" disabled></div><p id="settings-error" class="form-error"></p><button class="btn btn-primary" type="submit">Save profile</button></form></section><section class="panel"><h3>Appearance</h3><p style="font-size:13px">Choose the appearance that feels comfortable. This preference is stored in this browser only.</p><button class="btn btn-secondary" data-action="theme">${icon(state.theme==='dark'?'sun':'moon',15)} Switch to ${state.theme==='dark'?'light':'dark'} theme</button><hr class="divider"><h3>Account session</h3><p style="font-size:13px">Sign out to clear your current session cookie on the server.</p><button class="btn btn-danger" data-action="logout">${icon('logout',14)} Sign out</button></section></div>`;}
function contentView(r){if(r==='/dashboard'||r==='/dashboard/overview')return overviewPage();if(r==='/dashboard/tools')return toolsPage();if(r==='/dashboard/calendar')return calendarPage();if(r==='/dashboard/competitors')return competitorsPage();if(r==='/dashboard/projects')return projectsPage();if(r==='/dashboard/billing')return billingPage();if(r==='/dashboard/settings')return settingsPage();const match=r.match(/^\/dashboard\/tool\/([^/]+)$/);if(match)return toolPage(decodeURIComponent(match[1]));return `${pageTitle('Page not found','Choose a workspace from the navigation.')}<a class="btn btn-primary" href="#/dashboard">Back to overview</a>`;}
async function getMe(silent=true){try{const p=await api('/api/auth/me');state.user=p.user;state.usage=p.usage;state.loaded=true;return true;}catch(e){state.user=null;state.usage=null;state.loaded=true;if(e.status!==401&& !silent)toast(e.message,'error');return false;}}
async function refreshData(){if(!state.user)return;state.dataError=null;try{const results=await Promise.allSettled([api('/api/auth/me'),api('/api/projects'),api('/api/tasks'),api('/api/competitors')]);if(results[0].status==='fulfilled'){state.user=results[0].value.user;state.usage=results[0].value.usage;}else throw results[0].reason;if(results[1].status==='fulfilled'){state.projects=results[1].value.projects||[];state.outputs=results[1].value.outputs||[];}else if(results[1].reason.status!==401)state.dataError=results[1].reason.message;if(results[2].status==='fulfilled')state.tasks=results[2].value.tasks||[];else if(results[2].reason.status!==401)state.dataError=state.dataError||results[2].reason.message;if(results[3].status==='fulfilled')state.competitors=results[3].value.competitors||[];else if(results[3].reason.status!==401)state.dataError=state.dataError||results[3].reason.message;}catch(e){state.dataError=e.message;if(e.status===401){state.user=null;go('/login');return;}}}
async function render(){const r=route();if(r.startsWith('/dashboard')){if(!state.user){const valid=await getMe(true);if(!valid){go('/login');root.innerHTML=authPage(false);return;}}await refreshData();if(!state.user){go('/login');root.innerHTML=authPage(false);return;}root.innerHTML=dashboardShell(contentView(r));return;}if(r==='/features')root.innerHTML=featuresPage();else if(r==='/pricing')root.innerHTML=`${publicNav()}<main><section class="page-hero"><div class="container"><span class="eyebrow">Pricing</span><h1>Choose the capacity you need.</h1><p>Start with core planning tools. Upgrade for expanded usage and advanced content tools.</p></div></section><section class="section"><div class="container">${pricingCards()}</div></section></main>${footer()}`;else if(r==='/about')root.innerHTML=aboutPage();else if(r==='/contact')root.innerHTML=contactPage();else if(r==='/login')root.innerHTML=authPage(false);else if(r==='/register')root.innerHTML=authPage(true);else if(r==='/privacy')root.innerHTML=legalPage('privacy');else if(r==='/terms')root.innerHTML=legalPage('terms');else if(r==='/refunds')root.innerHTML=legalPage('refunds');else if(r==='/'||r==='/home')root.innerHTML=homePage();else root.innerHTML=`${publicNav()}<main class="container section"><div class="empty-state"><h2>Page not found</h2><p>This page isn't available.</p><a class="btn btn-primary" href="#/">Return home</a></div></main>${footer()}`;}
function showFormError(id,message){const el=document.getElementById(id);if(!el)return;el.textContent=message;el.classList.add('show');}
function formValues(form){const data=Object.fromEntries(new FormData(form).entries());for(const [k,v] of Object.entries(data)){if(typeof v==='string')data[k]=v.trim();}return data;}
async function handleSubmit(e){const f=e.target;if(!(f instanceof HTMLFormElement))return;
if(f.id==='auth-form'){e.preventDefault();const btn=f.querySelector('button[type="submit"]');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Please wait';const d=formValues(f);try{const result=await api(f.dataset.mode==='register'?'/api/auth/register':'/api/auth/login',{method:'POST',body:JSON.stringify(d)});state.user=result.user;await getMe(true);toast(f.dataset.mode==='register'?'Account created.':'Signed in successfully.','success');go('/dashboard');}catch(err){showFormError('auth-error',err.message);}finally{btn.disabled=false;btn.textContent=f.dataset.mode==='register'?'Create account':'Sign in';}return;}
if(f.id==='contact-form'){e.preventDefault();const btn=f.querySelector('button[type="submit"]');btn.disabled=true;try{const d=formValues(f);const result=await api('/api/contact',{method:'POST',body:JSON.stringify(d)});toast(result.message||'Message saved.','success');f.reset();}catch(err){showFormError('contact-error',err.message);}finally{btn.disabled=false;}return;}
if(f.id==='ai-form'){e.preventDefault();const btn=f.querySelector('button[type="submit"]');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Generating…';const d=formValues(f);const tool=f.dataset.tool;const projectId=d.projectId||null;delete d.projectId;try{const idempotency=window.crypto?.randomUUID?crypto.randomUUID():`lp-${Date.now()}-${Math.random().toString(36).slice(2)}`;const result=await api('/api/ai/generate',{method:'POST',headers:{'Idempotency-Key':idempotency},body:JSON.stringify({tool,input:d,projectId})});state.toolResult={tool,title:`${TOOLS[tool].title} · ${new Date().toLocaleDateString()}`,contentId:result.contentId,result:result.result};state.usage=result.quota||state.usage;await refreshData();root.innerHTML=dashboardShell(contentView(route()));toast('Draft generated and saved.','success');}catch(err){showFormError('ai-error',err.message);if(err.status===402||err.code==='QUOTA_EXCEEDED')toast(err.message,'error');if(err.status===403&&err.code==='PRO_REQUIRED')toast('This tool requires an active Pro membership.','error');}finally{const current=document.querySelector('#ai-form button[type="submit"]');if(current){current.disabled=TOOLS[tool].pro&&state.usage?.plan!=='PRO';current.innerHTML=icon('spark',15)+' Generate '+esc(TOOLS[tool].title);}}return;}
if(f.id==='task-form'){e.preventDefault();const d=formValues(f);const id=f.dataset.id;const data={...d,dueDate:d.dueDate?new Date(`${d.dueDate}T12:00:00.000Z`).toISOString():null,projectId:d.projectId||null};try{await api(id?`/api/tasks/${encodeURIComponent(id)}`:'/api/tasks',{method:id?'PATCH':'POST',body:JSON.stringify(data)});await refreshData();root.innerHTML=dashboardShell(calendarPage());toast(id?'Task updated.':'Task created.','success');}catch(err){toast(err.message,'error');}return;}
if(f.id==='competitor-form'){e.preventDefault();const d=formValues(f);const id=f.dataset.id;const data={...d,url:d.url||'',projectId:d.projectId||null,researchedAt:d.researchedAt?new Date(`${d.researchedAt}T12:00:00.000Z`).toISOString():new Date().toISOString()};try{await api(id?`/api/competitors/${encodeURIComponent(id)}`:'/api/competitors',{method:id?'PATCH':'POST',body:JSON.stringify(data)});await refreshData();root.innerHTML=dashboardShell(competitorsPage());toast(id?'Research note updated.':'Research note saved.','success');}catch(err){toast(err.message,'error');}return;}
if(f.id==='billing-form'){e.preventDefault();const btn=f.querySelector('button[type="submit"]');btn.disabled=true;try{const data=formValues(f);const result=await api('/api/billing/refresh',{method:'POST',body:JSON.stringify(data)});state.usage=result.usage||state.usage;await refreshData();root.innerHTML=dashboardShell(billingPage());toast(result.message||'Membership refreshed.','success');}catch(err){showFormError('billing-error',err.message);}finally{btn.disabled=false;}return;}
if(f.id==='settings-form'){e.preventDefault();try{const d=formValues(f);const result=await api('/api/settings',{method:'PATCH',body:JSON.stringify(d)});state.user={...state.user,...result.user};root.innerHTML=dashboardShell(settingsPage());toast('Profile updated.','success');}catch(err){showFormError('settings-error',err.message);}return;}
}
async function handleClick(e){const themeTarget=e.target.closest('[data-action]');if(!themeTarget)return;const action=themeTarget.dataset.action;const id=themeTarget.dataset.id;
if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('lp_theme',state.theme);document.documentElement.dataset.theme=state.theme;await render();return;}
if(action==='menu'){document.getElementById('mobile-public-nav')?.classList.toggle('hidden');return;}
if(action==='home'){go('/');return;}
if(action==='logout'){try{await api('/api/auth/logout',{method:'POST',body:JSON.stringify({})});}catch(err){toast(err.message,'error');}state.user=null;state.usage=null;go('/');toast('You have been signed out.','success');return;}
if(action==='create-project'){const title=prompt('Project title');if(!title||!title.trim())return;const description=prompt('Short project description (optional)')||'';try{await api('/api/projects',{method:'POST',body:JSON.stringify({title:title.trim(),description:description.trim()})});await refreshData();root.innerHTML=dashboardShell(contentView(route()));toast('Project created.','success');}catch(err){toast(err.message,'error');}return;}
if(action==='rename-project'){const p=state.projects.find(x=>x.id===id);if(!p)return;const title=prompt('New project title',p.title);if(!title||!title.trim())return;try{await api(`/api/projects/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({title:title.trim()})});await refreshData();root.innerHTML=dashboardShell(projectsPage());toast('Project renamed.','success');}catch(err){toast(err.message,'error');}return;}
if(action==='delete-project'){if(!confirm('Delete this project? Associated tasks and generated content may also be removed according to database relations.'))return;try{await api(`/api/projects/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshData();root.innerHTML=dashboardShell(projectsPage());toast('Project deleted.','success');}catch(err){toast(err.message,'error');}return;}
if(action==='new-task'){root.innerHTML=dashboardShell(taskDialog(null));return;}
if(action==='edit-task'){const t=state.tasks.find(x=>x.id===id);if(t)root.innerHTML=dashboardShell(taskDialog(t));return;}
if(action==='cancel-dialog'){await render();return;}
if(action==='delete-task'){if(!confirm('Delete this task?'))return;try{await api(`/api/tasks/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshData();root.innerHTML=dashboardShell(calendarPage());toast('Task deleted.','success');}catch(err){toast(err.message,'error');}return;}
if(action==='toggle-task'){const t=state.tasks.find(x=>x.id===id);if(!t)return;try{await api(`/api/tasks/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({status:t.status==='done'?'todo':'done'})});await refreshData();root.innerHTML=dashboardShell(contentView(route()));}catch(err){toast(err.message,'error');}return;}
if(action==='new-competitor'){root.innerHTML=dashboardShell(competitorDialog(null));return;}
if(action==='edit-competitor'){const c=state.competitors.find(x=>x.id===id);if(c)root.innerHTML=dashboardShell(competitorDialog(c));return;}
if(action==='delete-competitor'){if(!confirm('Delete this research note?'))return;try{await api(`/api/competitors/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshData();root.innerHTML=dashboardShell(competitorsPage());toast('Research note deleted.','success');}catch(err){toast(err.message,'error');}return;}
if(action==='open-output'||action==='edit-output'){const o=state.outputs.find(x=>x.id===id);if(!o)return;state.toolResult={tool:o.type,title:o.title,contentId:o.id,result:o.body,id:o.id};root.innerHTML=dashboardShell(`${pageTitle(esc(o.title),'Review and edit a previously generated draft.')}<section class="panel">${outputEditor(state.toolResult)}</section>`);return;}
if(action==='save-output'){const editor=document.getElementById('result-editor');if(!editor)return;try{const title=document.getElementById('result-title')?.value?.trim()||'Generated draft';await api(`/api/content/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({title,body:editor.value})});state.toolResult={...(state.toolResult||{}),title,contentId:id,result:editor.value};await refreshData();toast('Draft changes saved.','success');}catch(err){toast(err.message,'error');}return;}
if(action==='copy-output'){const editor=document.getElementById('result-editor');if(!editor)return;try{await navigator.clipboard.writeText(editor.value);toast('Copied to clipboard.','success');}catch{editor.select();document.execCommand('copy');toast('Copied to clipboard.','success');}return;}
if(action==='export-output'){const editor=document.getElementById('result-editor');if(!editor)return;const blob=new Blob([editor.value],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='launchpilot-draft.md';a.click();URL.revokeObjectURL(url);return;}
if(action==='delete-output'){if(!confirm('Delete this saved output?'))return;try{await api(`/api/content/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshData();root.innerHTML=dashboardShell(projectsPage());toast('Output deleted.','success');}catch(err){toast(err.message,'error');}}
}
async function handleChange(e){const t=e.target;if(t.id==='task-filter'){state.activeFilter=t.value;root.innerHTML=dashboardShell(calendarPage());return;}if(t.matches('[data-action="task-check"]')){const task=state.tasks.find(x=>x.id===t.dataset.id);if(!task)return;try{await api(`/api/tasks/${encodeURIComponent(task.id)}`,{method:'PATCH',body:JSON.stringify({status:t.checked?'done':'todo'})});await refreshData();root.innerHTML=dashboardShell(calendarPage());}catch(err){t.checked=!t.checked;toast(err.message,'error');}}}
window.addEventListener('hashchange',()=>{const r=route();if(r.startsWith('/dashboard')&&!state.user){getMe(true).then(ok=>{if(!ok)go('/login');else render();});}else render().catch(e=>{root.innerHTML=`<main class="container section"><div class="error-panel">Unable to render the page: ${esc(e.message)}</div></main>`;});});
document.addEventListener('submit',e=>{handleSubmit(e).catch(err=>toast(err.message,'error'));});
document.addEventListener('click',e=>{const target=e.target instanceof Element?e.target:null;const checkout=target?.closest('a[data-checkout-link="missing"]');if(checkout){e.preventDefault();toast('LaunchPilot Pro checkout is not configured yet. The app owner must add WHOP_PRO_CHECKOUT_URL in deployment settings.','error');return;}handleClick(e).catch(err=>toast(err.message,'error'));});
document.addEventListener('change',e=>{handleChange(e).catch(err=>toast(err.message,'error'));});
(async()=>{if(route().startsWith('/dashboard'))await getMe(true);try{await render();}catch(e){root.innerHTML=`<main class="container section"><div class="error-panel">Unable to render the page. ${esc(e.message)}</div></main>`;}})();
})();
</script>
</body>
</html>
